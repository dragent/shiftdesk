services:
  mysql:
    image: mysql:8.0
    container_name: shiftdesk_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: shiftdesk
      MYSQL_USER: shiftdesk
      MYSQL_PASSWORD: shiftdesk
      MYSQL_ROOT_PASSWORD: root
    ports:
      # Exposé sur 3307 côté hôte pour éviter les conflits avec un MySQL
      # local déjà installé sur le port 3306.
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: shiftdesk_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - mysql

  # Catch-all SMTP for local mail (recruitment welcome messages).
  mailpit:
    image: axllent/mailpit:latest
    container_name: shiftdesk_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  # --- Module IA (supervision de planning) ---
  ai-service:
    build:
      context: ./ai-service
    container_name: shiftdesk_ai_service
    restart: unless-stopped
    ports:
      - "8001:8001"

  # --- Backend Symfony ---
  backend:
    build:
      context: ./backend
    container_name: shiftdesk_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_ENV: prod
      APP_SECRET: 8f61b0e7f6a1c3d9e2b4a7c8d5f0e3a1
      DATABASE_URL: "mysql://shiftdesk:shiftdesk@mysql:3306/shiftdesk?serverVersion=8.0.36&charset=utf8mb4"
      CORS_ALLOW_ORIGIN: '^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$$'
      AI_SERVICE_URL: "http://ai-service:8001"
      JWT_PASSPHRASE: "779d42ba92812f5fb1a0c4fa745f1d7fe6f7edbddd3354703410e2f62b6f9051"
      MAILER_DSN: "smtp://mailpit:1025"
      MAILER_FROM: "ShiftDesk <noreply@carrefour-accueil.local>"
      FRONTEND_URL: "http://localhost:3000"
    depends_on:
      mysql:
        condition: service_healthy
      ai-service:
        condition: service_started
      mailpit:
        condition: service_started

  # --- Frontend Next.js ---
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:8000"
    container_name: shiftdesk_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mysql_data:
