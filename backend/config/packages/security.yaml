security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # Un métier porte les droits de sa catégorie. Directeur/rice inherits
    # Direction; Direction inherits every other job. Admin inherits Directeur.
    role_hierarchy:
        ROLE_ADMIN: [ROLE_DIRECTEUR]
        ROLE_DIRECTEUR: [ROLE_DIRECTION]
        ROLE_DIRECTION: [ROLE_HOTE, ROLE_CAISSIER, ROLE_LAD, ROLE_RAYON, ROLE_SECURITE]

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        login:
            pattern: ^/api/login
            stateless: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            json_login:
                check_path: /api/login
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            jwt: ~

        main:
            lazy: true
            provider: app_user_provider

    access_control:
        - { path: ^/api/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/doc, roles: PUBLIC_ACCESS }
        - { path: ^/api/categories, roles: [ROLE_ADMIN, ROLE_DIRECTION, ROLE_HOTE], methods: [GET] }
        - { path: ^/api/categories, roles: ROLE_ADMIN }
        - { path: ^/api/sites, roles: [ROLE_ADMIN, ROLE_DIRECTION, ROLE_HOTE], methods: [GET] }
        - { path: ^/api/sites, roles: ROLE_ADMIN }
        # La direction gère les employés (recrutement, licenciement, coordonnées,
        # et suppression définitive d'un licencié en environnement de dev).
        - { path: ^/api/users, roles: [ROLE_ADMIN, ROLE_DIRECTION], methods: [GET, POST, PUT, PATCH, DELETE] }
        - { path: ^/api/users, roles: ROLE_ADMIN }
        - { path: ^/api/jobs, roles: [ROLE_ADMIN, ROLE_DIRECTION] }
        - { path: ^/api/caissiers, roles: [ROLE_ADMIN, ROLE_DIRECTION, ROLE_HOTE], methods: [GET, PUT, PATCH] }
        - { path: ^/api/caissiers, roles: [ROLE_ADMIN, ROLE_DIRECTION] }
        - { path: ^/api/plannings/\d+/register-number, roles: [ROLE_ADMIN, ROLE_DIRECTION, ROLE_HOTE], methods: [PATCH] }
        - { path: ^/api/plannings, roles: [ROLE_ADMIN, ROLE_DIRECTION], methods: [POST, PUT, PATCH, DELETE] }
        - { path: ^/api/plannings, roles: [ROLE_ADMIN, ROLE_DIRECTION, ROLE_HOTE, ROLE_CAISSIER, ROLE_LAD, ROLE_RAYON, ROLE_SECURITE] }
        - { path: ^/api/absences, roles: [ROLE_ADMIN, ROLE_DIRECTION], methods: [POST, PUT, PATCH, DELETE] }
        - { path: ^/api/absences, roles: [ROLE_ADMIN, ROLE_DIRECTION, ROLE_HOTE, ROLE_CAISSIER, ROLE_LAD, ROLE_RAYON, ROLE_SECURITE] }
        - { path: ^/api/store-closures, roles: [ROLE_ADMIN, ROLE_DIRECTION], methods: [POST, PUT, PATCH, DELETE] }
        - { path: ^/api/store-closures, roles: [ROLE_ADMIN, ROLE_DIRECTION, ROLE_HOTE, ROLE_CAISSIER, ROLE_LAD, ROLE_RAYON, ROLE_SECURITE] }
        - { path: ^/api/pauses, roles: [ROLE_ADMIN, ROLE_DIRECTION, ROLE_HOTE] }
        - { path: ^/api/requests, roles: [ROLE_ADMIN, ROLE_DIRECTION, ROLE_HOTE] }
        # Direction/Admin: write, edit, close, delete, readers. Hôte: read Accueil + seen.
        - { path: ^/api/direction-notes/\d+/close, roles: [ROLE_ADMIN, ROLE_DIRECTION], methods: [PATCH] }
        - { path: ^/api/direction-notes/\d+/readers, roles: [ROLE_ADMIN, ROLE_DIRECTION], methods: [GET] }
        - { path: ^/api/direction-notes/\d+/seen, roles: [ROLE_ADMIN, ROLE_DIRECTION, ROLE_HOTE], methods: [POST] }
        - { path: ^/api/direction-notes/\d+, roles: [ROLE_ADMIN, ROLE_DIRECTION], methods: [PATCH, DELETE] }
        - { path: ^/api/direction-notes, roles: [ROLE_ADMIN, ROLE_DIRECTION], methods: [POST] }
        - { path: ^/api/direction-notes, roles: [ROLE_ADMIN, ROLE_DIRECTION, ROLE_HOTE], methods: [GET] }
        # Annexe: websites are readable by every job (then filtered by métier);
        # only Direction/Admin may add or delete them.
        - { path: ^/api/annexe/websites, roles: [ROLE_ADMIN, ROLE_DIRECTION], methods: [POST, DELETE] }
        - { path: ^/api/annexe/websites, roles: [ROLE_ADMIN, ROLE_DIRECTION, ROLE_HOTE, ROLE_CAISSIER, ROLE_LAD, ROLE_RAYON, ROLE_SECURITE], methods: [GET] }
        # Named files: Direction + Accueil.
        - { path: ^/api/annexe/files, roles: [ROLE_ADMIN, ROLE_DIRECTION, ROLE_HOTE] }
        - { path: ^/api/ai, roles: [ROLE_ADMIN, ROLE_DIRECTION] }
        - { path: ^/api/me/password, roles: [ROLE_ADMIN, ROLE_DIRECTION, ROLE_HOTE, ROLE_CAISSIER, ROLE_LAD, ROLE_RAYON, ROLE_SECURITE], methods: [POST] }
        - { path: ^/api/me, roles: [ROLE_ADMIN, ROLE_DIRECTION, ROLE_HOTE, ROLE_CAISSIER, ROLE_LAD, ROLE_RAYON, ROLE_SECURITE] }
        - { path: ^/api, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
