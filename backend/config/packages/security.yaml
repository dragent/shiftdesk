security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        login:
            pattern: ^/api/login
            stateless: true
            json_login:
                check_path: /api/login
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            jwt: ~

        main:
            lazy: true
            provider: app_user_provider

    access_control:
        - { path: ^/api/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/doc, roles: PUBLIC_ACCESS }
        - { path: ^/api/categories, roles: [ROLE_ADMIN, ROLE_DIRECTION, ROLE_HOTE], methods: [GET] }
        - { path: ^/api/categories, roles: ROLE_ADMIN }
        - { path: ^/api/sites, roles: [ROLE_ADMIN, ROLE_DIRECTION, ROLE_HOTE], methods: [GET] }
        - { path: ^/api/sites, roles: ROLE_ADMIN }
        - { path: ^/api/users, roles: [ROLE_ADMIN, ROLE_DIRECTION], methods: [GET] }
        - { path: ^/api/users, roles: ROLE_ADMIN }
        - { path: ^/api/plannings, roles: [ROLE_ADMIN, ROLE_DIRECTION], methods: [POST, PUT, PATCH, DELETE] }
        - { path: ^/api/plannings, roles: [ROLE_ADMIN, ROLE_DIRECTION, ROLE_HOTE] }
        - { path: ^/api/pauses, roles: [ROLE_ADMIN, ROLE_DIRECTION, ROLE_HOTE] }
        - { path: ^/api/requests, roles: [ROLE_ADMIN, ROLE_DIRECTION, ROLE_HOTE] }
        - { path: ^/api/ai, roles: [ROLE_ADMIN, ROLE_DIRECTION] }
        - { path: ^/api/me, roles: [ROLE_ADMIN, ROLE_DIRECTION, ROLE_HOTE] }
        - { path: ^/api, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
